name: Publish Python package (TestPyPI by default)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to:
        description: 'Publish target (testpypi or pypi)'
        required: false
        default: 'testpypi'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build distribution
        run: python -m build --sdist --wheel

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to repository
        env:
          TWINE_USERNAME: __token__
        run: |
          TARGET="${{ github.event.inputs.publish_to || 'testpypi' }}"
          if [ "$TARGET" = 'pypi' ]; then
            echo "Publishing to PyPI (production)"
            if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
              echo "Missing PYPI_API_TOKEN secret. Aborting." && exit 1
            fi
            export TWINE_PASSWORD="${{ secrets.PYPI_API_TOKEN }}"
            python -m twine upload dist/*
          else
            echo "Publishing to TestPyPI (default)"
            if [ -z "${{ secrets.TEST_PYPI_API_TOKEN }}" ]; then
              echo "No TEST_PYPI_API_TOKEN found; attempting upload will fail unless provided." >&2
            fi
            export TWINE_PASSWORD="${{ secrets.TEST_PYPI_API_TOKEN }}"
            python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*
          fi
